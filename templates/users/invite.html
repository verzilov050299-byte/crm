{% extends "base.html" %}
{% block title %}Пригласить сотрудника — BizCRM{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <h1>Приглашение</h1>
    <p class="muted">Сотрудник получит письмо с адресом CRM, логином и паролем.</p>
  </div>
  <a class="btn btn-ghost" href="{{ url_for('users_list') }}">К списку</a>
</div>

<form class="form" method="post">
  <label>Имя *
    <input name="name" required placeholder="Денис Орлов">
  </label>
  <label>Почта *
    <input name="email" type="email" required placeholder="denis@autoservice.ru">
  </label>
  <label>Роль *
    <select name="role_id" required>
      {% for role in roles %}
      <option value="{{ role.id }}">{{ role.name }}</option>
      {% endfor %}
    </select>
  </label>
  <div class="form-actions">
    <button class="btn" type="submit">Отправить приглашение</button>
  </div>
</form>
{% endblock %}
